<div class="row">
    <h5><b>Datos del paciente</b></h5>

    <!-- Fila 1: Identificación y Nombres -->
    <div class="col-md-2">
        <label>Tipo Documento:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="TipoDocumentoBase">
            <option value="">Seleccionar</option>
            <option value="CC">Cédula de Ciudadanía</option>
            <option value="TI">Tarjeta de Identidad</option>
            <option value="RC">Registro Civil</option>
            <option value="CE">Cédula de Extranjería</option>
            <option value="PA">Pasaporte</option>
            <option value="PE">Permiso Especial</option>
            <option value="PT">Permiso por Protección Temporal</option>
        </select>
    </div>
    <div class="col-md-2">
        <label>Número Documento:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="DocumentoPaciente">
    </div>
    <div class="col-md-2">
        <label>Primer Apellido:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="PrimerApellidoBase">
    </div>
    <div class="col-md-2">
        <label>Segundo Apellido:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="SegundoApellidoBase">
    </div>
    <div class="col-md-2">
        <label>Primer Nombre:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="PrimerNombreBase">
    </div>
    <div class="col-md-2">
        <label>Segundo Nombre:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="SegundoNombreBase">
    </div>

    <!-- Fila 2: Nacimiento, Género y Nacionalidad -->
    <div class="col-md-3">
        <label>Fecha y Hora Nacimiento:</label>
        <input type="datetime-local" class="form-control-sm border border-secondary w-100 mb-2"
            id="FechaNacimientoBase">
    </div>
    <div class="col-md-1">
        <label>Edad:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" readonly id="EdadPaciente">
    </div>
    <div class="col-md-2">
        <label>Sexo Biológico:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="SexoPaciente">
            <option value="">Seleccionar</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
        </select>
    </div>
    <div class="col-md-3">
        <label>Identidad de Género:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="IdentidadGeneroBase">
            <option value="">Seleccionar</option>
            <option value="1">Masculino</option>
            <option value="2">Femenino</option>
            <option value="3">Transgenero</option>
            <option value="4">Neutro</option>
            <option value="5">No declara</option>
        </select>
    </div>
    <div class="col-md-3">
        <label>Nacionalidad (País):</label>
        <div class="input-group input-group-sm">
            <input type="text" class="form-control border border-secondary" placeholder="Cod"
                id="CodPaisNacionalidadBase" style="max-width: 50px;">
            <input type="text" class="form-control border border-secondary" placeholder="Nombre País"
                id="NombrePaisNacionalidadBase">
        </div>
    </div>

    <!-- Fila 3: Ubicación y Demografía Social -->
    <div class="col-md-3">
        <label>País Residencia:</label>
        <div class="input-group input-group-sm mb-2">
            <input type="text" class="form-control border border-secondary" placeholder="Cod" id="CodPaisResidenciaBase"
                style="max-width: 50px;">
            <input type="text" class="form-control border border-secondary" placeholder="Nombre País"
                id="NombrePaisResidenciaBase">
        </div>
    </div>
    <div class="col-md-3">
        <label>Municipio Residencia:</label>
        <div class="input-group input-group-sm mb-2">
            <input type="text" class="form-control border border-secondary" placeholder="Cod"
                id="CodMunicipioResidenciaBase" style="max-width: 50px;">
            <input type="text" class="form-control border border-secondary" placeholder="Nombre Municipio"
                id="NombreMunicipioResidenciaBase">
        </div>
    </div>
    <div class="col-md-3">
        <label>Zona Territorial:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="ZonaTerritorialBase">
            <option value="">Seleccionar</option>
            <option value="01">Urbana</option>
            <option value="02">Rural</option>
        </select>
    </div>
    <div class="col-md-3">
        <label>Dirección:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="DireccionPaciente">
    </div>

    <!-- Fila 4: Extra Social y Alergias -->
    <div class="col-md-3">
        <label>Etnia:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="EtniaBase">
            <option value="">Seleccionar</option>
            <option value="01">Indígena</option>
            <option value="02">Rrom (gitano)</option>
            <option value="03">Raizal (San Andrés y Providencia)</option>
            <option value="04">Palenquero (San Basilio)</option>
            <option value="05">Negro(a), Mulato(a), Afrocolombiano(a)</option>
            <option value="06">Ninguno</option>
        </select>
    </div>
    <div class="col-md-3">
        <label>Comunidad Étnica:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="ComunidadEtnicaBase">
    </div>
    <div class="col-md-3">
        <label>Discapacidad:</label>
        <select class="form-select-sm border border-secondary w-100 mb-2" id="DiscapacidadBase">
            <option value="">Seleccionar</option>
            <option value="00">No aplica</option>
            <option value="01">Física</option>
            <option value="02">Auditiva</option>
            <option value="03">Visual</option>
            <option value="04">Sordoceguera</option>
            <option value="05">Intelectual</option>
            <option value="06">Mental</option>
            <option value="07">Múltiple</option>
        </select>
    </div>
    <div class="col-md-3">
        <label>Teléfono:</label>
        <input type="text" class="form-control-sm border border-secondary w-100 mb-2" id="TelefonoPaciente">
    </div>

    <!-- Fila 5: Alergias -->
    <div class="col-md-12 mt-2">
        <div class="card p-2 border-secondary">
            <h6 class="text-muted">Alergias</h6>
            <div class="row align-items-center">
                <div class="col-md-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="TieneAlergiaBase">
                        <label class="form-check-label" for="TieneAlergiaBase">
                            ¿Tiene Alergias?
                        </label>
                    </div>
                </div>
                <div class="col-md-10">
                    <label>Nombre del Alérgeno / Detalles:</label>
                    <input type="text" class="form-control-sm border border-secondary w-100" id="NombreAlergenoBase"
                        placeholder="Describa la alergia si marca la casilla presione ENTER para agregar" disabled>
                </div>
            </div>
        </div>
    </div>

    <!-- Input oculto para compatibilidad temporal con JS existente -->
    <input type="hidden" id="NombrePaciente">
</div>
