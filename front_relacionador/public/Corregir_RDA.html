<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corregir RDA — CEERE</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Asignar_RIPS.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
    <script>
        if (localStorage.getItem('ceere_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body class="app-layout">
    <nav class="cr-topbar" id="crTopbar">
        <div class="cr-topbar-brand d-flex align-items-center flex-wrap gap-2">
            <img src="images/Ceere_logo.png" alt="Logo" class="cr-topbar-logo">
            <span class="cr-topbar-title">Relacionador RIPS</span>
            <span class="text-muted d-none d-sm-inline">|</span>
            <nav class="d-flex align-items-center gap-2 flex-wrap" aria-label="Módulos">
                <a href="RIPS.html" class="link-secondary text-decoration-none small fw-semibold">Inicio</a>
                <span class="text-muted small">·</span>
                <a href="EnvioRdaPendientes.html" class="link-secondary text-decoration-none small fw-semibold">Envío RDA pendientes</a>
                <span class="text-muted small">·</span>
                <span class="small fw-semibold" style="color: var(--color-primary, #007E82);">Corregir RDA</span>
            </nav>
        </div>
        <div class="cr-topbar-right">
            <button type="button" class="cr-topbar-logout" id="crBtnThemeToggle">
                <i class="fa-solid fa-moon"></i>
                <span>Tema Oscuro</span>
            </button>
        </div>
    </nav>

    <div class="cr-page-content">
        <h1 class="cr-page-heading">Corrección de RDA</h1>
        <main class="container-fluid px-0">
            <div class="alert border-0 mb-4" role="alert"
                style="background: var(--color-primary-light); color: var(--color-text); border-left: 4px solid var(--color-primary) !important;">
                <strong id="lblContexto">Cargando...</strong>
                <div class="small mt-1">Corrija los campos y guarde. Luego puede reintentar envío IHCE.</div>
            </div>

            <div class="cr-card cr-card-left-border mb-4">
                <div class="cr-card-body">
                    <form id="frmCorregir">
                        <div class="row g-3" id="camposContainer"></div>
                        <div class="mt-4 d-flex flex-wrap gap-2">
                            <button type="submit" class="btn" style="background: var(--color-primary); color: #fff; border: none;">
                                <i class="ri-save-line me-1"></i> Guardar correcciones
                            </button>
                            <button type="button" id="btnReenviar" class="btn btn-outline-secondary">
                                <i class="ri-send-plane-line me-1"></i> Reintentar envío IHCE
                            </button>
                            <select id="selAmbiente" class="form-select form-select-sm" style="max-width: 180px;">
                                <option value="sandbox" selected>Sandbox</option>
                                <option value="prod">Producción</option>
                            </select>
                            <a href="EnvioRdaPendientes.html" class="btn btn-light border">Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/config.js"></script>
    <script src="/apiConfig.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script type="module">
        import { mountAppSidebar } from "./shared/appSidebar.js";
        import { guardPageAccess, applyProductUiGates } from "./shared/featureFlags.js";
        if (!guardPageAccess({ requireRda: true })) {
          applyProductUiGates();
          mountAppSidebar({ active: "envio" });
        }
    </script>
    <script src="Corregir_RDA.js"></script>
</body>
</html>
