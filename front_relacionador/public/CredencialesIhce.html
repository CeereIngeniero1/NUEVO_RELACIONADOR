<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciales IHCE — CEERE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Asignar_RIPS.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="icon" href="images/Logo.png" type="image/x-icon">
    <style>
        .ihce-cred-panel {
            border: 1px solid var(--color-border, #dee2e6);
            border-radius: 0.65rem;
            padding: 1.1rem 1.25rem;
            background: var(--color-surface, #fff);
            height: 100%;
        }
        [data-theme="dark"] .ihce-cred-panel {
            background: var(--color-surface-elevated, #1e293b);
        }
        .ihce-cred-panel h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .ihce-cred-panel--sandbox h2 { color: var(--color-primary, #007E82); }
        .ihce-cred-panel--prod h2 { color: #b02a37; }
        .ihce-cred-hint {
            font-size: 0.8rem;
            color: var(--color-text-secondary, #6c757d);
        }
    </style>
    <script>
        if (localStorage.getItem('ceere_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>

<body class="app-layout">

    <nav class="cr-topbar" id="crTopbar">
        <div class="cr-topbar-brand d-flex align-items-center flex-wrap gap-2">
            <img src="images/Ceere_logo.png" alt="Logo" class="cr-topbar-logo">
            <span class="cr-topbar-title">Relacionador RIPS</span>
            <span class="text-muted d-none d-sm-inline">|</span>
            <span class="small fw-semibold" style="color: var(--color-primary, #007E82);">Credenciales IHCE</span>
        </div>
        <div class="cr-topbar-right">
            <div class="cr-topbar-user">
                <div class="cr-topbar-user-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span id="TopbarUserName">Usuario</span>
            </div>
            <button type="button" class="cr-topbar-logout" id="crBtnThemeToggle">
                <i class="fa-solid fa-moon"></i>
                <span>Tema Oscuro</span>
            </button>
        </div>
    </nav>

    <div class="cr-page-content">
        <h1 class="cr-page-heading">Credenciales IHCE por empresa</h1>
        <main class="container-fluid px-0">
            <div class="cr-card cr-card-left-border mb-4">
                <div class="cr-card-body">
                    <p class="mb-2">
                        Empresa activa:
                        <strong id="lblDocumentoEmpresa">—</strong>
                    </p>
                    <p class="ihce-cred-hint mb-0">
                        Los secretos (Client Secret y Subscription Key) no se muestran.
                        Déjelos vacíos para no cambiarlos. Complete sandbox y/o producción según necesite.
                    </p>
                    <div class="mt-3">
                        <button type="button" id="btnRecargar" class="btn btn-outline-secondary btn-sm">
                            <i class="ri-refresh-line me-1"></i> Recargar
                        </button>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12 col-lg-6">
                    <form id="formSandbox" class="ihce-cred-panel ihce-cred-panel--sandbox">
                        <h2><i class="ri-cloud-line me-1"></i> Sandbox</h2>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbBaseUrl">Base URL</label>
                            <input id="sbBaseUrl" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbTenantId">Tenant Id</label>
                            <input id="sbTenantId" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbClientId">Client Id</label>
                            <input id="sbClientId" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbClientSecret">Client Secret</label>
                            <input id="sbClientSecret" class="form-control" type="password" autocomplete="new-password"
                                placeholder="Vacío = no cambiar">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbScope">Scope</label>
                            <input id="sbScope" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbSubKey">Subscription Key</label>
                            <input id="sbSubKey" class="form-control" type="password" autocomplete="new-password"
                                placeholder="Vacío = no cambiar">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbReps">Custodian REPS</label>
                            <input id="sbReps" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="sbNit">Custodian NIT</label>
                            <input id="sbNit" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="sbName">Custodian Name</label>
                            <input id="sbName" class="form-control" autocomplete="off">
                        </div>
                        <button type="submit" class="btn" style="background: var(--color-primary); color: #fff; border: none;">
                            <i class="ri-save-line me-1"></i> Guardar sandbox
                        </button>
                    </form>
                </div>
                <div class="col-12 col-lg-6">
                    <form id="formProd" class="ihce-cred-panel ihce-cred-panel--prod">
                        <h2><i class="ri-shield-keyhole-line me-1"></i> Producción</h2>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prBaseUrl">Base URL</label>
                            <input id="prBaseUrl" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prTenantId">Tenant Id</label>
                            <input id="prTenantId" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prClientId">Client Id</label>
                            <input id="prClientId" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prClientSecret">Client Secret</label>
                            <input id="prClientSecret" class="form-control" type="password" autocomplete="new-password"
                                placeholder="Vacío = no cambiar">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prScope">Scope</label>
                            <input id="prScope" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prSubKey">Subscription Key</label>
                            <input id="prSubKey" class="form-control" type="password" autocomplete="new-password"
                                placeholder="Vacío = no cambiar">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prReps">Custodian REPS</label>
                            <input id="prReps" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold" for="prNit">Custodian NIT</label>
                            <input id="prNit" class="form-control" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="prName">Custodian Name</label>
                            <input id="prName" class="form-control" autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-danger">
                            <i class="ri-save-line me-1"></i> Guardar producción
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/config.js"></script>
    <script src="/apiConfig.js"></script>
    <script src="/NombreEquipoServidor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script type="module">
        import { mountAppSidebar } from "./shared/appSidebar.js";
        import { guardPageAccess, applyProductUiGates } from "./shared/featureFlags.js";
        if (!guardPageAccess({ requireRda: true })) {
            applyProductUiGates();
            mountAppSidebar({ active: "credenciales-ihce" });
        }
    </script>
    <script type="module" src="CredencialesIhce.js?v=20260917a"></script>
</body>

</html>
