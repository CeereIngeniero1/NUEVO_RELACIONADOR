<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIAR SESIÓN - RIPS</title>

    <!-- ESTILOS PERSONALIZADOS -->
    <link rel="stylesheet" href="style_login.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- BOXICONS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- ALERTIFY -->
    <link rel="stylesheet" href="node_modules/alertifyjs/build/css/alertify.min.css" />
    <link rel="stylesheet" href="node_modules/alertifyjs/build/css/themes/default.min.css" />

    <!-- SWEETALERT2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">

    <link rel="icon" href="images/Logo.png" type="image/x-icon">
</head>

<body>
    <div class="login-wrapper">

        <!-- Panel izquierdo -->
        <div class="login-left">
            <!-- Arriba: Resoluciones -->
            <div class="brand-top">
                <span class="badge-pill">Resolución 2275</span>
                <span class="badge-pill">Resolución 1888</span>
            </div>

            <!-- Centro: Logo + texto grande -->
            <div class="login-left-content">
                <img src="images/Ceere_logo.png" alt="CEERE Logo" class="brand-icon">
                <p class="brand-subtitle">Relacionador RIPS</p>
            </div>

            <!-- Abajo: Seguro y confiable + copyright -->
            <div class="brand-bottom">
                <span class="badge-pill badge-bottom">🔒 Seguro y confiable</span>
                <p class="brand-copyright">Copyright © 2025 CEERE Software. Todos los derechos reservados.</p>
            </div>
        </div>

        <!-- Panel derecho -->
        <div class="login-right">
            <div class="login-card">
                <div class="login-card-logo">
                    <img src="images/Ceere_logo.png" alt="CEERE" class="card-logo-img">
                </div>

                <p class="login-welcome">Bienvenido de nuevo</p>
                <h1 class="login-title">Iniciar Sesión</h1>

                <div class="login-field">
                    <i class='bx bx-user login-field-icon'></i>
                    <input type="text" placeholder="Usuario" id="inputUsername" class="login-input"
                        autocomplete="username">
                </div>

                <div class="login-field">
                    <i class='bx bx-lock login-field-icon'></i>
                    <input type="password" placeholder="Contraseña" id="inputPassword" class="login-input"
                        autocomplete="current-password">
                    <a id="btnShow" class="login-toggle-pass"><i class='bx bx-show'></i></a>
                    <a id="btnHide" class="login-toggle-pass" style="display:none"><i class='bx bx-hide'></i></a>
                </div>

                <button type="button" id="btnIngresar" class="login-btn">INICIAR SESIÓN</button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="./NombreEquipoServidor.js"></script>
    <script src="script.js"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="node_modules/alertifyjs/build/alertify.min.js"></script>
</body>

</html>
